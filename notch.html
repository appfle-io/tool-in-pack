<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TIP · 노치 아일랜드</title>
  <meta name="color-scheme" content="dark light">
  <meta name="robots" content="noindex">

  <script>
    (function () {
      try {
        var saved = localStorage.getItem('tip.theme');
        var dark = saved ? saved === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        var accent = localStorage.getItem('tip.accent');
        document.documentElement.setAttribute('data-accent',
          ['green', 'blue', 'purple', 'orange', 'rose', 'slate'].indexOf(accent) >= 0 ? accent : 'green');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>

  <link rel="stylesheet" href="./css/app.css">
  <link rel="stylesheet" href="./css/notch.css">
  <script type="module" src="./js/notch.js"></script>
</head>
<body class="notch-body">
  <div class="notch is-collapsed" id="notch" role="dialog" aria-label="TIP 노치 아일랜드">
    <!-- 접힌 상태 — 노치 아래에 붙은 작은 필
         v1.15.0 — 음악이 재생 중이면 왼쪽 날개, 타이머가 돌면 오른쪽 날개. 가운데(--notch-gap)는
         물리 노치 자리라 아무것도 그리지 않는다.
         v1.17.0 — 알약에는 이퀄라이저와 남은 시간만 둔다(곡 제목·진행률은 반원과 전체 보기에서).
         파일을 끌고 오면 '여기에 놓기', 놓은 뒤에는 '보관함 +2' 를 잠깐 보여 준다(pill-note). -->
    <button class="pill" id="pill" type="button" aria-label="TIP 노치 열기">
      <span class="pill-wing pill-wing-left" id="pill-left">
        <span class="pill-logo" id="pill-logo">TIP</span>
        <span class="pill-eq" id="pill-eq" aria-hidden="true" hidden><i></i><i></i><i></i><i></i></span>
        <span class="pill-drop-icon" id="pill-drop-icon" aria-hidden="true" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="m7.5 10.5 4.5 4.5 4.5-4.5"/><path d="M5 19.5h14"/></svg>
        </span>
        <span class="pill-dot" id="pill-dot" aria-hidden="true"></span>
      </span>
      <span class="pill-gap" id="pill-gap" aria-hidden="true"></span>
      <span class="pill-wing pill-wing-right" id="pill-right">
        <span class="pill-timer" id="pill-timer" hidden>
          <svg class="pill-timer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 10v3.6l2.2 1.4"/><path d="M9.5 3h5"/></svg>
          <b id="pill-clock">00:00</b>
        </span>
        <b class="pill-note" id="pill-note" hidden></b>
      </span>
    </button>

    <!-- v1.17.0 — 펼친 판(.notch-sheet) 하나가 두 화면을 담는다.
         간단히 보기(.dial, 반원 다이얼)와 전체 보기(.panel). 판의 높이·모서리만 바뀌어
         반원이 아래로 늘어나 둥근 사각형이 되는 것처럼 보인다(예전 반원 퀵바 창 radial.html 을 옮김). -->
    <div class="notch-sheet" id="sheet">
    <section class="dial" id="dial" aria-label="모듈 고르기">
      <div class="dial-top">
        <button class="dial-icon" id="dial-cal" type="button" aria-label="달력 열기" title="달력 열기" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 9.5h17M8 3.5V6M16 3.5V6"/></svg>
        </button>
        <button class="dial-side dial-media" id="dial-media" type="button" hidden>
          <span class="dial-side-art" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6.5l10-2V16"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>
          </span>
          <span class="dial-side-text">
            <b id="dial-media-title"></b>
            <span id="dial-media-state">재생 중</span>
          </span>
        </button>
        <button class="dial-arrow" id="dial-prev" type="button" aria-label="왼쪽으로 돌리기" title="왼쪽으로 돌리기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg>
        </button>
        <div class="dial-hub">
          <b class="dial-name" id="dial-name" aria-live="polite"></b>
          <span class="dial-desc" id="dial-desc"></span>
          <input class="dial-find" id="dial-find" type="text" autocomplete="off" spellcheck="false" placeholder="이름으로 찾기" aria-label="모듈 이름으로 찾기">
        </div>
        <button class="dial-arrow" id="dial-next" type="button" aria-label="오른쪽으로 돌리기" title="오른쪽으로 돌리기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg>
        </button>
        <button class="dial-side dial-timer" id="dial-timer" type="button" hidden>
          <span class="dial-side-text">
            <b id="dial-timer-clock">00:00</b>
            <span id="dial-timer-state">타이머 남음</span>
          </span>
          <span class="dial-side-art dial-timer-art" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 10v3.6l2.2 1.4"/><path d="M9.5 3h5"/></svg>
          </span>
        </button>
        <button class="dial-icon dial-shelf" id="dial-shelf" type="button" aria-label="임시 보관함 열기" title="임시 보관함" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 7.5A2 2 0 0 1 5.5 5.5h4l2 2.5h7a2 2 0 0 1 2 2v7.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg>
          <span class="dial-badge" id="dial-shelf-count" aria-hidden="true" hidden></span>
        </button>
      </div>
      <div class="dial-slots" id="dial-slots" role="group" aria-label="켜 둔 모듈"></div>
      <div class="dial-empty" id="dial-empty" hidden>
        <p>켜 둔 모듈이 없습니다</p>
        <button class="sheet-toggle" type="button" data-open-settings="1">환경설정 열기</button>
      </div>
      <div class="dial-drop" id="dial-drop" aria-hidden="true" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="m7.5 10.5 4.5 4.5 4.5-4.5"/><path d="M5 19.5h14"/></svg>
        <b>놓으면 임시 보관함에 저장해요</b>
      </div>
      <button class="sheet-toggle dial-to-full" id="to-full" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        전체 보기
      </button>
    </section>

    <!-- 펼친 상태 — 전체 보기 -->
    <section class="panel" id="panel" aria-label="노치 아일랜드 위젯">
      <header class="panel-head">
        <span class="panel-logo">TIP</span>
        <div class="panel-actions">
          <button class="panel-btn" id="open-home" type="button" aria-label="TIP 앱 열기" title="TIP 앱 열기">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5"/><path d="M6 9.5V20h12V9.5"/></svg>
          </button>
          <button class="panel-btn" id="open-settings" type="button" aria-label="환경설정" title="환경설정">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          </button>
          <button class="panel-btn" id="collapse" type="button" aria-label="접기" title="접기">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 14 6-6 6 6"/></svg>
          </button>
        </div>
      </header>

      <div class="widgets" id="widgets"></div>

      <!-- v1.13.0 — 캘린더 달력 보기(일별·주별·월별). 캘린더 카드의 달력 버튼으로 열고 닫는다. -->
      <section class="cal-view" id="cal-view" aria-label="캘린더 달력" hidden>
        <header class="cal-view-head">
          <div class="cal-view-nav">
            <button class="cal-icon-btn" type="button" data-cal-step="-1" aria-label="이전" title="이전">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m14 6-6 6 6 6"/></svg>
            </button>
            <button class="cal-view-title" type="button" id="cal-view-title" title="오늘로">이번 달</button>
            <button class="cal-icon-btn" type="button" data-cal-step="1" aria-label="다음" title="다음">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m10 6 6 6-6 6"/></svg>
            </button>
          </div>
          <div class="cal-view-tools">
            <button class="cal-tool cal-add-btn" type="button" id="cal-add-btn" title="일정 추가">+ 일정</button>
            <button class="cal-tool" type="button" id="cal-today-btn" title="오늘로">오늘</button>
            <button class="cal-tool" type="button" id="cal-filter-btn" aria-expanded="false" title="캘린더 고르기">캘린더</button>
            <button class="cal-icon-btn" type="button" id="cal-view-close" aria-label="달력 닫기" title="닫기">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
            </button>
          </div>
        </header>

        <div class="cal-view-tabs" role="tablist" aria-label="보기 단위">
          <button class="cal-tab" type="button" role="tab" data-cal-mode="day" aria-selected="false">일별</button>
          <button class="cal-tab" type="button" role="tab" data-cal-mode="week" aria-selected="false">주별</button>
          <button class="cal-tab is-on" type="button" role="tab" data-cal-mode="month" aria-selected="true">월별</button>
        </div>

        <div class="cal-filter-panel" id="cal-filter-panel" hidden>
          <div class="cal-filter-head">
            <span>표시할 캘린더 <em>macOS 캘린더 앱과 따로 저장됩니다</em></span>
            <span class="cal-filter-actions">
              <button class="cal-link" type="button" data-cal-filter="all">모두</button>
              <button class="cal-link" type="button" data-cal-filter="none">없음</button>
            </span>
          </div>
          <ul class="cal-filter-list" id="cal-filter-list"></ul>
        </div>

        <div class="cal-grid-wrap" id="cal-grid-wrap"></div>
        <div class="cal-day-head" id="cal-day-head"></div>
        <ul class="cal-day-list" id="cal-day-list"></ul>
      </section>

      <!-- v1.15.0 — 일정 추가 (EventKit). 달력·다가오는 일정 카드의 + 로 연다. -->
      <section class="cal-form" id="cal-form" aria-label="일정 추가" hidden>
        <header class="cal-form-head">
          <b>일정 추가</b>
          <button class="cal-icon-btn" type="button" id="cal-form-close" aria-label="닫기" title="닫기">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </header>
        <label class="cal-field">
          <span>제목</span>
          <input class="cal-input" id="cal-form-title" type="text" maxlength="120" autocomplete="off" spellcheck="false" placeholder="예: 시우 병원">
        </label>
        <label class="cal-check"><input type="checkbox" id="cal-form-allday"> 종일 일정</label>
        <div class="cal-form-dates">
          <label class="cal-field">
            <span>시작</span>
            <input class="cal-input" id="cal-form-start-date" type="date">
            <input class="cal-input cal-time" id="cal-form-start-time" type="time" step="60">
          </label>
          <label class="cal-field">
            <span>끝</span>
            <input class="cal-input" id="cal-form-end-date" type="date">
            <input class="cal-input cal-time" id="cal-form-end-time" type="time" step="60">
          </label>
        </div>
        <label class="cal-field">
          <span>캘린더</span>
          <select class="cal-input" id="cal-form-calendar"></select>
        </label>
        <p class="cal-form-note" id="cal-form-note">저장하면 맥 캘린더 앱에도 바로 보입니다.</p>
        <div class="cal-form-actions">
          <button class="cal-btn primary" type="button" id="cal-form-save">저장</button>
          <button class="cal-btn" type="button" id="cal-form-cancel">취소</button>
        </div>
      </section>

      <p class="panel-empty" id="panel-empty" hidden>
        표시할 위젯이 없습니다.<br>TIP 환경설정 → 노치 아일랜드에서 켜세요.
      </p>

      <p class="panel-hint" id="panel-hint">노치에서 마우스를 내리면 접힙니다. Esc로도 닫힙니다</p>
      <button class="sheet-toggle" id="to-simple" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg>
        간단히 보기
      </button>
    </section>
    </div>
  </div>

  <div class="notch-toast" id="notch-toast" role="status" aria-live="polite"></div>
</body>
</html>
