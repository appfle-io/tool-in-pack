[package]
name = "tip"
version = "1.13.0"
description = "TIP (TOOL-IN-PACK) macOS 앱"
authors = ["유동규 <appfle.io@gmail.com>"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "tip_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 앱 업데이트 확인·다운로드 (GitHub Releases) — 공개 릴리스 정보만 읽는다.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "native-tls"] }
futures-util = "0.3"
# v1.12.0 — 클립보드 히스토리(로컬 백그라운드 감시)와 전역 빠른 실행 단축키
arboard = "3"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
tauri-plugin-global-shortcut = "2"
# v1.12.4 — 자동 업데이트 파일의 SHA-256 대조(SHA256SUMS.txt).
sha2 = "0.10"

# v1.12.1 — 노치 아일랜드 창을 NSPanel 로 바꿔 메뉴 막대 위(y=0)에 붙인다.
# v1.12.2 — 같은 패널을 objc2 런타임 서브클래스(TipNotchPanel)로 바꿔 키 입력을 받게 한다.
# v1.12.4 — 캘린더를 AppleScript 대신 EventKit(EKEventStore)으로 직접 읽는다.
# Tauri 2 가 이미 쓰는 objc2 계열과 같은 버전대라 크레이트가 겹치지 않는다.
# AppKit 바인딩은 기본값(모든 클래스) 대신 쓰는 클래스만 켠다 — 빌드가 가볍고 빠르다.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSApplication",
  "NSPanel",
  "NSScreen",
  "NSEvent",
  "NSWindow",
  "NSView",
  "NSResponder",
  # v1.13.0 — 캘린더 색(EKCalendar.color)을 #RRGGBB 로 바꾸려면 색 공간 변환이 필요하다.
  "NSColor",
  "NSColorSpace",
] }
objc2-event-kit = { version = "0.3", default-features = false, features = [
  "std",
  "EKEventStore",
  "EKEvent",
  "EKCalendar",
  "EKCalendarItem",
  "EKObject",
  "EKTypes",
  # v1.13.0 — EKCalendar.color / source (캘린더 목록·색)
  "EKSource",
  "objc2-app-kit",
  "block2",
] }
objc2-foundation = "0.3"
