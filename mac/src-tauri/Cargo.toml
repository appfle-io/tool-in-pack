[package]
name = "tip"
version = "1.10.0"
description = "TIP (TOOL-IN-PACK) macOS 앱"
authors = ["유동규 <appfle.io@gmail.com>"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "tip_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 앱 업데이트 확인·다운로드 (GitHub Releases) — 공개 릴리스 정보만 읽는다.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "native-tls"] }
futures-util = "0.3"
