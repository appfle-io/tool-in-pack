<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TIP · TOOL-IN-PACK</title>
  <meta name="description" content="작은 도구들을 한곳에 모은 모듈형 유틸리티 — TIP (TOOL-IN-PACK)">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#2E5E4E" id="meta-theme-color">

  <!-- apply the saved theme before first paint -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('tip.theme');
        var dark = saved ? saved === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        var accent = localStorage.getItem('tip.accent');
        document.documentElement.setAttribute('data-accent',
          ['green', 'blue', 'purple', 'orange', 'rose', 'slate'].indexOf(accent) >= 0 ? accent : 'green');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>

  <!-- PWA / iOS home screen -->
  <link rel="manifest" href="./manifest.json">
  <meta name="application-name" content="TIP">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TIP">

  <link rel="stylesheet" href="./css/app.css">

  <!-- self-hosted libraries (pinned, no runtime CDN) -->

  <script src="./vendor/dompurify/purify.min.js" defer></script>

</head>
