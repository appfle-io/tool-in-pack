<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TIP · 우편번호 검색</title>
  <meta name="robots" content="noindex">
  <style>
    /* v1.15.1 — 다음(카카오) 우편번호 서비스를 앱 본문과 다른 창에서 띄운다.
       이 창은 capabilities/default.json 의 windows 목록에 없어 Tauri IPC 권한이 없고, Rust 가
       window.__TAURI__·window.__TAURI_INTERNALS__ 를 지운 뒤 문서를 연다. 그래서 카카오 스크립트가
       IPC 를 부를 수 없고, 부모 창(parent.__TAURI__)도 없다 — 이 창에는 parent 가 자기 자신이다. */
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #FFFFFF;
      color: #1F2422;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }
    #postcode-embed {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      box-sizing: border-box;
    }
    #postcode-embed iframe {
      width: 100% !important;
      height: 100% !important;
      border: 0;
      display: block;
    }
    #postcode-status {
      margin: 0;
      padding: 22px 20px;
      font-size: 13px;
      line-height: 1.7;
      color: #5C6663;
    }
    #postcode-status b { color: #1F2422; }
    #postcode-retry {
      margin-top: 12px;
      padding: 8px 14px;
      border: 1px solid #D6DCD9;
      border-radius: 8px;
      background: #FFFFFF;
      color: #1F2422;
      font: inherit;
      font-size: 12.5px;
      cursor: pointer;
    }
    #postcode-embed[hidden], #postcode-status[hidden] { display: none; }
  </style>
  <script src="./js/postcode.js" defer></script>
</head>
<body>
  <div id="postcode-embed" hidden></div>
  <p id="postcode-status">우편번호 서비스를 불러오는 중…</p>
</body>
</html>
