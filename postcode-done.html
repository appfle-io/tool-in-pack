<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TIP · 주소를 골랐습니다</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="./css/app.css">
  <style>
    /* v1.15.1 — 우편번호 창이 주소를 고른 뒤 잠깐 보이는 안내. 이 창에는 Tauri IPC 권한이 없다
       (capabilities 의 windows 목록에 없음). 그래서 닫기는 TIP 본문 창이 대신 부른다.
       혹시 본문 창이 결과를 받지 못해도 쓸 수 있게, 고른 주소를 그대로 보여 주고 복사 버튼을 둔다. */
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #FFFFFF;
      color: #1F2422;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }
    .done {
      max-width: 420px;
      margin: 0 auto;
      padding: 34px 24px;
      box-sizing: border-box;
    }
    .done h1 {
      margin: 0 0 6px;
      font-size: 16px;
      font-weight: 700;
    }
    .done p.lead {
      margin: 0 0 18px;
      font-size: 12.5px;
      line-height: 1.7;
      color: #5C6663;
    }
    .done dl {
      margin: 0 0 16px;
      border: 1px solid #E3E8E6;
      border-radius: 10px;
      overflow: hidden;
    }
    .done .row {
      display: flex;
      gap: 12px;
      padding: 10px 12px;
      border-top: 1px solid #EFF2F1;
      font-size: 12.5px;
      line-height: 1.6;
    }
    .done .row:first-child { border-top: 0; }
    .done .row dt {
      flex: none;
      width: 84px;
      color: #78827F;
    }
    .done .row dd {
      margin: 0;
      flex: 1;
      min-width: 0;
      word-break: break-all;
    }
    .done .hint {
      margin: 0;
      font-size: 12px;
      line-height: 1.7;
      color: #5C6663;
    }
  </style>
  <script src="./js/postcode-done.js" defer></script>
</head>
<body>
  <main class="done">
    <h1>주소를 골랐습니다</h1>
    <p class="lead">TIP 창으로 돌아가면 고른 주소가 결과에 채워집니다. 이 창은 잠시 뒤 스스로 닫힙니다.</p>
    <dl id="done-rows"></dl>
    <p class="hint" id="done-hint">창이 닫히지 않으면 직접 닫아 주세요.</p>
  </main>
</body>
</html>
