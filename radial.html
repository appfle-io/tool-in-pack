<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TIP · 메뉴 막대 퀵바</title>
  <meta name="color-scheme" content="dark light">
  <meta name="robots" content="noindex">

  <!-- 메인 창과 같은 테마·색상을 첫 페인트 전에 적용한다. -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('tip.theme');
        var dark = saved ? saved === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        var accent = localStorage.getItem('tip.accent');
        document.documentElement.setAttribute('data-accent',
          ['green', 'blue', 'purple', 'orange', 'rose', 'slate'].indexOf(accent) >= 0 ? accent : 'green');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>

  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
  <link rel="stylesheet" href="./css/app.css">
  <link rel="stylesheet" href="./css/radial.css">
  <script type="module" src="./js/radial.js"></script>
</head>
<body class="rw-body">
  <div class="rw" id="rw" role="dialog" aria-label="TIP 메뉴 막대 퀵바">
    <!-- 반원 유리 배경 — 위는 일직선, 아래는 매끈한 반원. clip-path 는 radial.js 가 같은 곡선으로 만든다. -->
    <div class="rw-fan" aria-hidden="true">
      <div class="rw-fan-glass" id="fan-glass"></div>
    </div>
    <svg class="rw-edge" id="fan-edge" aria-hidden="true"><path id="fan-path" fill="none"></path></svg>

    <div class="rw-top">
      <button id="prev" class="rw-arrow" type="button" aria-label="이전 모듈" title="이전 모듈">‹</button>
      <!-- 가운데 허브: 앱 열기(작게) + 환경설정 -->
      <div class="rw-hub" role="group" aria-label="TIP 창 열기">
        <button id="open-app" class="rw-open" type="button" aria-label="TIP 앱 열기" title="TIP 앱 열기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4 11 13"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
          <span>앱 열기</span>
        </button>
        <button id="open-settings" class="rw-open rw-gear" type="button" aria-label="환경설정" title="환경설정">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </div>
      <button id="next" class="rw-arrow" type="button" aria-label="다음 모듈" title="다음 모듈">›</button>
    </div>

    <div class="rw-slots" id="slots" role="menu" aria-label="켜 둔 모듈"></div>

    <p class="rw-empty" id="empty" hidden>켜 둔 모듈이 없습니다.<br>위 환경설정에서 모듈을 켜세요.</p>
  </div>
</body>
</html>
