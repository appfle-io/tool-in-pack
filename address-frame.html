<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TIP · 우편번호 검색</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="./css/app.css">
  <style>
    /* v1.14.0 — 우편번호 창이 왼쪽 위에 작게 뜨던 문제.
       프레임 안 문서에 높이가 없으면 다음 우편번호 서비스가 embed 할 때 0 높이로 그리고
       작은 상자만 남는다. html·body·#wrap·#addr-frame-embed 를 모두 100% 로 못 박는다. */
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #FFFFFF;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }
    :root[data-theme='dark'] html, :root[data-theme='dark'] body, :root[data-theme='dark'] #wrap {
      background: #FFFFFF; /* 우편번호 서비스는 흰 배경 기준이라 다크에서도 흰 바탕을 쓴다 */
    }
    #wrap,
    #addr-frame-embed {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      box-sizing: border-box;
    }
    #addr-frame-embed iframe {
      width: 100% !important;
      height: 100% !important;
      border: 0;
      display: block;
    }
    #addr-frame-status {
      margin: 0;
      padding: 18px 16px;
      font-size: 12.5px;
      line-height: 1.6;
      color: #6b7472;
    }
    #addr-frame-embed[hidden], #addr-frame-status[hidden] { display: none; }
  </style>
  <script src="./js/address-frame.js" defer></script>
</head>
<body>
  <!-- 다음(카카오) 우편번호 서비스만 이 문서 안에서 돈다(v1.12.4).
       메인 화면(index.html)은 이 서비스의 스크립트를 직접 불러오지 않는다 —
       앱 화면과 다른 문서에서 돌려 결과만 postMessage 로 받는다. -->
  <div id="wrap">
    <p id="addr-frame-status">우편번호 서비스를 불러오는 중…</p>
    <div id="addr-frame-embed" hidden></div>
  </div>
</body>
</html>
